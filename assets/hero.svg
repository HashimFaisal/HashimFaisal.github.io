    <path d="M80 23 122 47 122 105 80 129 80 76Z" fill="url(#cyan)" stroke="#58D8E8" stroke-width="1.5"/>
    <path d="M80 76 122 52 122 105 80 129Z" fill="#111D33" opacity=".22"/>
    <path d="M69 57 101 76 69 95Z" fill="#070B16" stroke="#F2F6FF" stroke-width="2"/>
    <path d="M58 111 80 124 102 111" fill="none" stroke="#A2B1C8" stroke-width="2" opacity=".8"/>
