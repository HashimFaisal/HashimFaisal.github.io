<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Hashim Faisal logo</title>
  <desc id="desc">Metallic silver and cyan geometric emblem with a play symbol and orbital accents.</desc>
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".42" stop-color="#b8c9df"/>
      <stop offset=".72" stop-color="#f5fbff"/>
      <stop offset="1" stop-color="#7e9ab8"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9cf4ff"/>
      <stop offset=".48" stop-color="#28d9f4"/>
      <stop offset="1" stop-color="#087de8"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9fbff"/>
      <stop offset="1" stop-color="#168fe8"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M78 18 124 44 124 105 78 132 32 105 32 54 78 28" stroke="#168fe8" stroke-opacity=".35" stroke-width="2"/>
    <path d="M78 20 119 44 119 96 78 120 37 96 37 49 78 25" fill="#0b1930" stroke="url(#edge)" stroke-width="3"/>
    <path d="M78 20 78 69 37 93 37 49Z" fill="url(#silver)" stroke="#e8f8ff" stroke-width="1.5"/>
    <path d="M78 20 119 44 119 96 78 120 78 69 119 45" fill="url(#cyan)" stroke="#76eaff" stroke-width="1.5"/>
    <path d="M78 69 119 45 119 96 78 120Z" fill="#087de8" opacity=".28"/>
    <path d="M67 53 98 71 67 89Z" fill="#071426" stroke="#9cf4ff" stroke-width="2" filter="url(#glow)"/>
    <path d="M26 91C8 106 8 126 28 137 43 145 61 137 77 122" stroke="url(#cyan)" stroke-width="5"/>
    <path d="M91 34C112 13 136 15 145 34 151 47 143 62 127 75" stroke="url(#cyan)" stroke-width="5"/>
    <path d="M25 92C43 75 58 68 76 62" stroke="#168fe8" stroke-width="2" opacity=".8"/>
  </g>
</svg>