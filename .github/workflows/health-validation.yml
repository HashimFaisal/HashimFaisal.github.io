name: Health report validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate Python syntax
        run: python -m py_compile scripts/check_links.py
      - name: Validate JSON data and release history
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in ("data/status.json", "data/changelog.json", "data/updates.json"):
              if Path(path).exists():
                  json.loads(Path(path).read_text(encoding="utf-8"))

          history = json.loads(Path("data/changelog.json").read_text(encoding="utf-8"))
          release_keys = set()
          for item in history:
              if item.get("type") != "release":
                  continue
              version = item.get("new_version")
              channel = item.get("channel")
              if not version or channel not in {"stable", "beta"}:
                  raise SystemExit(f"Invalid release record: {item}")
              key = (channel, version)
              if key in release_keys:
                  raise SystemExit(f"Duplicate release event: {key}")
              release_keys.add(key)
              prerelease = any(marker in version.lower() for marker in ("beta", "alpha", "rc", "preview", "dev"))
              if prerelease and channel != "beta":
                  raise SystemExit(f"Prerelease incorrectly marked stable: {version}")
          print("JSON and changelog validations passed.")
          PY
