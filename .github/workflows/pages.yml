name: Deploy Nuvio Control Center

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows:
      - Nuvio Control Center - Health
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website files
        run: |
          mkdir -p public/data public/assets
          cp index.html style.css app.js public/
          cp premium-ui.css premium-ui.js public/
          cp touch-effects.css touch-effects.js public/
          cp downloads-redesign.css public/
          cp data/status.json public/data/
          if [ -f data/changelog.json ]; then cp data/changelog.json public/data/; fi
          if [ -f data/updates.json ]; then cp data/updates.json public/data/; fi
          if [ -d assets ]; then cp -R assets/. public/assets/; fi

      - name: Version local CSS and JavaScript assets
        env:
          ASSET_VERSION: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          path = Path("public/index.html")
          html = path.read_text()
          version = os.environ["ASSET_VERSION"]

          pattern = r'((?:href|src)=["\'])((?!https?:|//)[^"\'?#]+\.(?:css|js))(?:\?[^"\']*)?(["\'])'

          def replace(match):
              return f"{match.group(1)}{match.group(2)}?v={version}{match.group(3)}"

          updated, count = re.subn(pattern, replace, html, flags=re.IGNORECASE)

          if count != 7:
              raise SystemExit(
                  f"Expected 7 local CSS/JS references, found {count}; refusing to deploy."
              )

          path.write_text(updated)
          print(f"Versioned {count} local assets with commit {version}")

          # Embed the public JSON data in the page so stalled secondary
          # requests cannot leave dashboard widgets on their loading labels.
          site_data = {}
          for key in ("status", "changelog", "updates"):
              data_path = Path("public/data") / f"{key}.json"
              if not data_path.is_file():
                  raise SystemExit(f"Required site data is missing: {data_path}")
              site_data[key] = json.loads(data_path.read_text(encoding="utf-8"))

          payload = json.dumps(site_data, separators=(",", ":"))
          payload = payload.replace("&", "\\u0026").replace("<", "\\u003c").replace(">", "\\u003e")
          marker = '  <script src="app.js'
          if marker not in updated:
              raise SystemExit("Could not locate the main application script.")
          embedded = f'  <script id="nuvio-site-data" type="application/json">{payload}</script>\\n'
          updated = updated.replace(marker, embedded + marker, 1)
          path.write_text(updated)
          print("Embedded status, changelog, and live-update data in the page.")

          if not (Path("public/downloads-redesign.css").is_file() and Path("public/downloads-redesign.css").stat().st_size > 0):
              raise SystemExit("downloads-redesign.css is missing from the deployment artifact.")
          PY

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Wait for Pages artifact metadata
        run: sleep 20

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
