name: Nuvio Control Center - Health

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/check_links.py"
      - "index.html"
      - "app.js"
      - "tests/browser-smoke.spec.cjs"
      - ".github/workflows/addon-health.yml"

permissions:
  contents: write

concurrency:
  group: nuvio-control-center-health
  cancel-in-progress: false

jobs:
  check:
    name: Verify manifests and latest release assets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate health-check script syntax
        run: python -m py_compile scripts/check_links.py

      - name: Test release-cache safety
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Run health checks
        id: health
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_links.py

      - name: Update published health report
        if: always() && steps.health.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "Health report unchanged."
          else
            git commit -m "Update automated health report"
            # Rebase onto the latest main to avoid non-fast-forward races with other writers.
            git fetch origin main
            git rebase origin/main
            git push
          fi

      - name: Save health report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-health-report
          path: data/status.json
          if-no-files-found: ignore
