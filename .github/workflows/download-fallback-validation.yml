name: Download fallback validation

on:
  pull_request:
    paths:
      - "scripts/check_links.py"
      - "app.js"
      - "tests/test_release_cache.py"
      - "tests/browser-smoke.spec.cjs"
      - ".github/workflows/download-fallback-validation.yml"
  push:
    branches:
      - "fix/release-download-fallback"
    paths:
      - "scripts/check_links.py"
      - "app.js"
      - "tests/test_release_cache.py"
      - "tests/browser-smoke.spec.cjs"
      - ".github/workflows/download-fallback-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Python syntax
        run: python -m py_compile scripts/check_links.py tests/test_release_cache.py
      - name: Release cache unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: JavaScript syntax
        run: node --check app.js
