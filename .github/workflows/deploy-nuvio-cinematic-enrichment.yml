name: Deploy Nuvio Cinematic Enrichment

on:
  push:
    branches: [main]
    paths:
      - "nuvio-cinematic-enrichment/**"
      - ".github/workflows/deploy-nuvio-cinematic-enrichment.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "nuvio-cinematic-enrichment"
          command: deploy
