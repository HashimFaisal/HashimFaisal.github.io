name: Deploy Nuvio Cinematic Enrichment

on:
  pull_request:
    paths:
      - "nuvio-cinematic-enrichment/**"
      - ".github/workflows/deploy-nuvio-cinematic-enrichment.yml"
  push:
    branches: [main]
    paths:
      - "nuvio-cinematic-enrichment/**"
      - ".github/workflows/deploy-nuvio-cinematic-enrichment.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Worker syntax
        run: node --input-type=module --check < nuvio-cinematic-enrichment/worker.js

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "nuvio-cinematic-enrichment"
          command: deploy
          secrets: |
            TMDB_API_KEY
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
